name: Ingest official updates

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civic-india-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Poll official sources
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ingest official updates
        id: ingest
        run: |
          set -o pipefail
          npm run --silent ingest:all | tee "$RUNNER_TEMP/ingestion-results.json"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Summarize ingestion results
        if: always()
        env:
          INGESTION_RESULTS_FILE: ${{ runner.temp }}/ingestion-results.json
          INGESTION_STEP_OUTCOME: ${{ steps.ingest.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from "node:fs";

          const resultsPath = process.env.INGESTION_RESULTS_FILE;
          const outcome = process.env.INGESTION_STEP_OUTCOME;
          let summary = "## Official source ingestion\n\n";

          if (!existsSync(resultsPath)) {
            summary += `The ingestion command ${outcome} before producing a result list. Check the step logs.\n`;
          } else {
            try {
              const results = JSON.parse(readFileSync(resultsPath, "utf8"));
              const succeeded = results.filter((result) => result.status === "succeeded");
              const failed = results.filter((result) => result.status === "failed");

              summary += `${succeeded.length} succeeded; ${failed.length} failed.\n\n`;
              summary += "| Source | Status | Items read | Created | Updated | Error |\n";
              summary += "| --- | --- | ---: | ---: | ---: | --- |\n";

              for (const result of results) {
                const error = String(result.error ?? "")
                  .replaceAll("|", "\\|")
                  .replace(/\r?\n/g, " ");
                summary += `| ${result.sourceKey} | ${result.status} | ${result.itemsRead ?? 0} | ${result.recordsCreated ?? 0} | ${result.recordsUpdated ?? 0} | ${error} |\n`;
              }

              if (failed.length > 0) {
                const failedSources = failed.map((result) => result.sourceKey).join(", ");
                console.log(`::warning title=Partial ingestion::${failed.length} source(s) failed: ${failedSources}. See the job summary.`);
              }
            } catch {
              summary += `Could not parse the ingestion result list. Check the step logs.\n`;
            }
          }

          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
