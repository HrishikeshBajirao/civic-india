name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civic-india-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, format, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check linting
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Migrate, seed, publish, and deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: civic-india-ingestion
      cancel-in-progress: false
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Log pulled Better Auth URL
        run: |
          node --env-file=.vercel/.env.production.local <<'NODE'
          const value = process.env.BETTER_AUTH_URL;
          if (!value) {
            console.log("BETTER_AUTH_URL is missing");
            process.exit(0);
          }

          try {
            const url = new URL(value);
            console.log(`BETTER_AUTH_URL protocol: ${url.protocol}`);
            console.log(`BETTER_AUTH_URL hostname: ${url.hostname}`);
            console.log(`BETTER_AUTH_URL pathname: ${url.pathname}`);
          } catch {
            console.log(`BETTER_AUTH_URL is present but invalid (length: ${value.length})`);
          }
          NODE

      - name: Validate pulled production auth URL
        run: |
          node --env-file=.vercel/.env.production.local <<'NODE'
          const value = process.env.BETTER_AUTH_URL;
          if (!value) {
            console.error(
              "BETTER_AUTH_URL is missing from the pulled Production environment.",
            );
            process.exit(1);
          }

          let url;
          try {
            url = new URL(value);
          } catch {
            console.error(
              "BETTER_AUTH_URL is present but is not an absolute URL. Include https:// and remove any surrounding quotes.",
            );
            process.exit(1);
          }

          const problems = [];
          if (url.protocol !== "https:") {
            problems.push(`protocol is ${url.protocol}; expected https:`);
          }
          if (["localhost", "127.0.0.1", "::1"].includes(url.hostname)) {
            problems.push("hostname is localhost");
          }

          if (problems.length) {
            console.error(`BETTER_AUTH_URL: ${problems.join("; ")}`);
            process.exit(1);
          }

          console.log("BETTER_AUTH_URL: valid public HTTPS URL");
          NODE

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed all 224 entities
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Vercel production output
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/civic-india:latest
            ${{ vars.DOCKERHUB_USERNAME }}/civic-india:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Ingest official updates
        continue-on-error: true
        run: npm run ingest:all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
